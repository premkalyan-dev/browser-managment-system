{% extends 'base.html' %}
{% block title %}Sign up · Todo App{% endblock %}
{% block content %}
  <section class="card">
    <h1>Create your account</h1>
    <form method="post" action="{{ url_for('signup') }}" class="form">
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required />
      </label>
      <label>Password
        <input type="password" name="password" required />
      </label>
      <label>Confirm password
        <input type="password" name="confirm" required />
      </label>
      <button class="btn primary" type="submit">Create account</button>
      <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Log in</a>.</p>
    </form>
  </section>
{% endblock %}
