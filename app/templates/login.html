{% extends 'base.html' %}
{% block title %}Login · Todo App{% endblock %}
{% block content %}
  <section class="card">
    <h1>Welcome back</h1>
    <form method="post" action="{{ url_for('login') }}" class="form">
      <label>Email
        <input type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" required />
      </label>
      <label>Password
        <input type="password" name="password" required />
      </label>
      <button class="btn primary" type="submit">Log in</button>
      <p class="muted">No account yet? <a href="{{ url_for('signup') }}">Sign up</a>.</p>
    </form>
  </section>
{% endblock %}
